<div *ngIf="message" class="alert-message">
  <p>{{ message }}</p>
</div>

<div class="container">
  <form class="reservation-form" (ngSubmit)="onSubmit()">
    <h2 class="form-title"><a routerLink="/resevation" routerLinkActive="active">Réserver un terrain</a></h2>
    <h2 class="form-title"><a routerLink="/Gymnasiumreservation" routerLinkActive="active">Réserver un gymnase</a></h2>
    <div class="form-group">
      <label for="terrain">Terrain :</label>
      <select id="terrain" [(ngModel)]="reservation.terrain.id" name="terrain" required>
        <option *ngFor="let terrain of terrains" [value]="terrain.id">{{ terrain.name }}</option>
      </select>
    </div>

    <div class="form-group">
      <label for="date">Date de réservation :</label>
      <input id="date" [(ngModel)]="reservation.date" name="date" type="date" required />
    </div>

    <div class="form-group">
      <label for="time">Heure de réservation :</label>
      <input id="time" [(ngModel)]="reservation.time" name="time" type="time" required />
    </div>

    <div class="form-group">
      <label for="endTime">Heure de fin :</label>
      <input id="endTime" [(ngModel)]="reservation.endTime" name="endTime" type="time" required />
    </div>

    <div class="form-group">
      <label for="reservedBy">Réservé par :</label>
      <input id="reservedBy" [(ngModel)]="reservation.reservedBy" name="reservedBy" type="text" />
    </div>

    <button type="submit" [disabled]="!reservation.terrain.id || !reservation.date || !reservation.time || !reservation.endTime" class="submit-btn">Réserver</button>
  </form>

  <div class="message-container">
    <p *ngIf="message" class="message success">{{ message }}</p>
    <p *ngIf="error" class="message error">{{ error }}</p>
  </div>
