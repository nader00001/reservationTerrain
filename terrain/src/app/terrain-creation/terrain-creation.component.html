<h2>Créer un terrain</h2>
<form (ngSubmit)="onSubmit(terrainForm)" #terrainForm="ngForm">
  <div>
    <label for="name">Nom du terrain :</label>
    <input
      type="text"
      id="name"
      name="name"
      [(ngModel)]="terrain.name"
      required
      #name="ngModel"
      [ngClass]="{'invalid': name.invalid && name.touched}" />
    <div *ngIf="name.invalid && name.touched" style="color: red;">
      Ce champ est obligatoire.
    </div>
  </div>

  <div>
    <label for="location">Emplacement :</label>
    <input
      type="text"
      id="location"
      name="location"
      [(ngModel)]="terrain.location"
      required
      #location="ngModel"
      [ngClass]="{'invalid': location.invalid && location.touched}" />
    <div *ngIf="location.invalid && location.touched" style="color: red;">
      Ce champ est obligatoire.
    </div>
  </div>

  <div>
    <label for="capacity">Capacité :</label>
    <input
      type="number"
      id="capacity"
      name="capacity"
      [(ngModel)]="terrain.capacity"
      required
      #capacity="ngModel"
      [ngClass]="{'invalid': capacity.invalid && capacity.touched}" />
    <div *ngIf="capacity.invalid && capacity.touched" style="color: red;">
      Ce champ est obligatoire.
    </div>
  </div>

  <div>
    <label for="type">Type :</label>
    <input
      type="text"
      id="type"
      name="type"
      [(ngModel)]="terrain.type"
      required
      #type="ngModel"
      [ngClass]="{'invalid': type.invalid && type.touched}" />
    <div *ngIf="type.invalid && type.touched" style="color: red;">
      Ce champ est obligatoire.
    </div>
  </div>

  <button type="submit" [disabled]="terrainForm.invalid">Créer</button>
</form>

<!-- Messages -->
<p *ngIf="message" style="color: green;">{{ message }}</p>
<p *ngIf="error" style="color: red;">{{ error }}</p>

<!-- Nouveau message de succès -->
<p *ngIf="successMessage" style="color: green;">{{ successMessage }}</p>
