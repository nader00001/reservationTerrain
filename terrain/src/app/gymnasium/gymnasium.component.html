<div class="form-container">
  <div class="form-card">
    <h2 class="mb-4 text-center">Créer un gymnase</h2>
    <form (ngSubmit)="onSubmit(gymnasiumForm)" #gymnasiumForm="ngForm">
      <!-- Nom du gymnase -->
      <div class="form-group">
        <label for="name" class="form-label">Nom du gymnase :</label>
        <input
          type="text"
          id="name"
          name="name"
          [(ngModel)]="gymnasium.name"
          required
          #name="ngModel"
          class="form-control"
          [ngClass]="{ 'is-invalid': name.invalid && name.touched }"
        />
        <div *ngIf="name.invalid && name.touched" class="invalid-feedback">
          Ce champ est obligatoire.
        </div>
      </div>

      <!-- Emplacement -->
      <div class="form-group">
        <label for="location" class="form-label">Emplacement :</label>
        <input
          type="text"
          id="location"
          name="location"
          [(ngModel)]="gymnasium.location"
          required
          #location="ngModel"
          class="form-control"
          [ngClass]="{ 'is-invalid': location.invalid && location.touched }"
        />
        <div *ngIf="location.invalid && location.touched" class="invalid-feedback">
          Ce champ est obligatoire.
        </div>
      </div>

      <!-- Capacité -->
      <div class="form-group">
        <label for="capacity" class="form-label">Capacité :</label>
        <input
          type="number"
          id="capacity"
          name="capacity"
          [(ngModel)]="gymnasium.capacity"
          required
          #capacity="ngModel"
          class="form-control"
          [ngClass]="{ 'is-invalid': capacity.invalid && capacity.touched }"
        />
        <div *ngIf="capacity.invalid && capacity.touched" class="invalid-feedback">
          Ce champ est obligatoire.
        </div>
      </div>

      <!-- Bouton de soumission -->
      <div class="form-actions text-center">
        <button type="submit" class="btn btn-primary w-100" [disabled]="gymnasiumForm.invalid">
          Créer
        </button>
      </div>
    </form>

    <!-- Messages -->
    <div class="mt-3">
      <p *ngIf="message" class="alert alert-success">{{ message }}</p>
      <p *ngIf="error" class="alert alert-danger">{{ error }}</p>
    </div>
  </div>
</div>
